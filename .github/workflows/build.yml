name: Compilar Dynamic Island

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar .exe (un solo archivo, no requiere instalar .NET)
        run: >
          dotnet publish DynamicIsland.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: publish/DynamicIsland.exe

      - name: Crear Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DynamicIsland.exe
          generate_release_notes: true
